[project]
name = "prism"
version = "1.0.0"
description = "PRISM - Player Replay Intelligence and Strategic Modeling: vision-based behavioral analytics for League of Legends players"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "PRISM Development Team" }]
keywords = ["league-of-legends", "computer-vision", "behavioral-analytics", "opencv", "pyside6"]
dependencies = [
    "PySide6>=6.6.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "easyocr>=1.7.1",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "reportlab>=4.1.0",
    "Pillow>=10.2.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.gui-scripts]
prism = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["gui*", "core*", "vision*", "analytics*", "reports*", "visualizations*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
